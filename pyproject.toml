[project]
name = "powerlift"
version = "0.1.0"
description = "Statistics for A/B tests done right: power analysis, frequentist and Bayesian analysis, variance reduction, sequential monitoring and sanity checks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Dai" }]
requires-python = ">=3.11"
keywords = [
    "ab-testing",
    "experimentation",
    "statistics",
    "power-analysis",
    "sequential-testing",
    "cuped",
    "bayesian",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.4", "scipy>=1.17"]

[project.urls]
Homepage = "https://github.com/ult666666/powerlift"
Repository = "https://github.com/ult666666/powerlift"
Issues = "https://github.com/ult666666/powerlift/issues"
Changelog = "https://github.com/ult666666/powerlift/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ult666666/powerlift/blob/main/docs/METHODOLOGY.md"

[project.scripts]
powerlift = "powerlift.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "matplotlib>=3.8",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "statsmodels>=0.14.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "NPY",  # numpy-specific rules
    "D",    # pydocstyle
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "PERF", # perflint
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D103"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# SciPy and statsmodels ship without type information. Their results are
# converted to plain floats / typed arrays at the call sites.
module = ["scipy.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["powerlift"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]
