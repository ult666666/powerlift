name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Overrides .python-version so every uv command uses the matrix interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: README doctests
        run: uv run pytest --doctest-glob="README.md" README.md

      - name: README doctests against the installed wheel
        # The README tells users to pip install the package, so check what a wheel
        # delivers, not only the source tree (the v0.1.0 wheel lacks the A/B/n API).
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -m doctest "$GITHUB_WORKSPACE/README.md"

      - name: CLI smoke test
        run: |
          uv run powerlift --version
          uv run powerlift sample-size --baseline 0.10 --mde 0.10 --relative --daily-traffic 4000
          uv run powerlift analyze --control 480/5000 --treatment 560/5000 --bayes
          uv run powerlift srm --observed 50421 49579
          uv run powerlift boundaries --looks 5 --method obrien-fleming --json
          uv run python examples/multi_arm_simulation.py --experiments 50 --csv "$RUNNER_TEMP/arms.csv"
          uv run powerlift analyze --csv "$RUNNER_TEMP/arms.csv" --group-col arm --value-col revenue_usd --control-label A --treatment-label B --treatment-label C --treatment-label D
